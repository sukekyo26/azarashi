# Claude Code 専用（`.claude.fragment.json` の `--add-mode` からのみ有効化）。
# Claude Code は自分の Edit の後にしか LSP 診断を返さないため、Edit で代替できる書き込み系を外す。
description: Leaves code edits to the client's built-in Edit; keeps only reference-aware refactors
prompt: |
  Serena's symbolic and file-based editing tools are not available. Edit code with the client's
  built-in Edit tool. Use Serena only to read and navigate code, and for the reference-aware
  refactors `rename_symbol` and `safe_delete_symbol`.
excluded_tools:
  - replace_symbol_body
  - insert_before_symbol
  - insert_after_symbol
  - replace_content
  - replace_in_files
  - open_dashboard
