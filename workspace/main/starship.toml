format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$aws\
$docker_context\
$python\
$nodejs\
$deno\
$rust\
$golang\
$terraform\
$jobs\
$cmd_duration\
$line_break\
$character"""

right_format = "$time"

[cmd_duration]
min_time = 2_000
format = "[ $duration]($style) "
style = "yellow"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"
read_only = " "

[git_branch]
style = "bold purple"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

[git_status]
style = "bold red"
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[aws]
format = '[$symbol($profile)(\($region\))(\[$duration\])]($style) '
symbol = " "
style = "bold yellow"

[aws.region_aliases]
ap-northeast-1 = "tokyo"
ap-northeast-3 = "osaka"
us-east-1 = "virginia"
us-west-2 = "oregon"
eu-west-1 = "ireland"
ap-southeast-1 = "singapore"

[docker_context]
format = "[$symbol$context]($style) "
symbol = " "
style = "bold blue"
only_with_files = false

[python]
format = "[$symbol$version( \\($virtualenv\\))]($style) "
symbol = " "
style = "bold green"
detect_files = [
    "pyproject.toml",
    "requirements.txt",
    ".python-version",
    "Pipfile",
    "uv.lock",
]
detect_folders = [".venv", "venv"]
detect_extensions = []

[nodejs]
format = "[$symbol$version]($style) "
symbol = " "
style = "bold green"
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_extensions = ["ts", "tsx"]
not_capable_style = "bold red"

[deno]
format = "[$symbol$version]($style) "
symbol = " "
style = "bold cyan"
detect_extensions = []
detect_files = ["deno.json", "deno.jsonc", "deno.lock"]

[rust]
format = "[$symbol$version]($style) "
symbol = " "
style = "bold red"

[golang]
format = "[$symbol$version]($style) "
symbol = " "
style = "bold cyan"

[terraform]
format = "[$symbol$workspace]($style) "
symbol = " "
style = "bold 105"

[jobs]
format = "[$symbol$number]($style) "
symbol = "⚙ "
style = "bold blue"
symbol_threshold = 1
number_threshold = 1

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "dimmed white"

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "bold dimmed green"

[username]
show_always = false
format = "[$user]($style)"
style_user = "bold dimmed blue"
