# File mirrors: deploy a single canonical source to additional $HOME locations
# as symlinks (no duplicated content). Read by dotfiles; never deployed.
#
# Format: two whitespace-separated, layer-relative paths per line:
#   <target>   <source>
# '#' lines and blank lines are ignored. The source is resolved through the
# active layers (users/<name>/ over common/), so a per-user override of the
# source is mirrored automatically. A file source becomes a file symlink; a
# directory source becomes a single directory symlink (dot-directories are
# always materialized, so list intermediate non-dot dirs like skills/ here).
#
# target                             source
.claude/CLAUDE.md                    .agents/AGENTS.md
.codex/AGENTS.md                     .agents/AGENTS.md
.copilot/copilot-instructions.md     .agents/AGENTS.md
.claude/skills                       .agents/skills
