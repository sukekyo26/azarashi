name: CI

on:
  push:
    branches: [main, develop, '*/*']
  pull_request:
    branches: [main, develop]

# Cancel an in-progress run when a newer commit lands on the same ref, so rapid
# pushes don't pile up redundant runs. push and pull_request use different refs,
# so a PR's checks still run alongside the branch push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: shellcheck + shfmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1

      # Install the latest upstream shellcheck (same source as the devcontainer)
      # so CI and local devcontainer share the same lint behavior. The ubuntu
      # runner's preinstalled shellcheck lags upstream and emits findings that
      # newer releases have already retracted.
      - name: Install latest shellcheck
        run: |
          set -euo pipefail
          sudo rm -f /usr/local/bin/shellcheck /usr/bin/shellcheck
          version=$(curl -fsSLI --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 --retry-all-errors \
            -o /dev/null -w '%{url_effective}' https://github.com/koalaman/shellcheck/releases/latest |
            sed 's|.*/tag/v||')
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 --retry-all-errors \
            "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 "shellcheck-v${version}/shellcheck"
          sudo chmod +x /usr/local/bin/shellcheck
          shellcheck --version

      - run: just check

  unit:
    name: lib unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh test/run.sh

  e2e:
    name: dotfiles E2E (shipped-payload smoke)
    # Deploys the REAL common/ to prove the shipped payload installs cleanly.
    # Assertions are structural (no specific filenames) so editing the payload
    # never breaks this job; mechanism behavior is covered by e2e-mechanism.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup isolated HOME
        run: |
          dir=$(mktemp -d)
          echo "HOME=$dir" >> "$GITHUB_ENV"

      - name: Dry-run on clean state — must not mutate HOME
        run: |
          ./dotfiles diff
          [ ! -e "$HOME/.claude" ]
          [ ! -e "$HOME/.agents" ]
          [ ! -e "$HOME/.copilot" ]

      - name: First install — and the real payload reports in-sync
        run: |
          ./dotfiles install
          ./dotfiles status | tee status.out
          ! grep -E '^[[:space:]]*(drift|missing|orphan)[[:space:]]*:' status.out

      - name: Layout invariants (structural, name-agnostic)
        run: |
          # top-level dot-directories are always real directories, never symlinks
          for d in .agents .claude .copilot; do
            [ -d "$HOME/$d" ]
            [ ! -L "$HOME/$d" ]
          done
          # no managed symlink dangles — every leaf resolves to a real source
          broken=$(find "$HOME" -type l ! -exec test -e {} \; -print)
          [ -z "$broken" ] || { echo "dangling symlinks:"; echo "$broken"; exit 1; }
          # something was actually deployed as leaf symlinks
          [ -n "$(find "$HOME/.agents" -type l 2>/dev/null | head -1)" ]
          # a fragment is merged into a real settings.json (not a symlink)
          [ -f "$HOME/.claude/settings.json" ]
          [ ! -L "$HOME/.claude/settings.json" ]

      - name: Idempotency — second install must not relink or remerge
        run: |
          ./dotfiles install | tee install2.out
          ! grep -E '^[[:space:]]*(linked|merged)[[:space:]]*:' install2.out

      - name: Uninstall removes managed symlinks (merged JSON intentionally remains)
        run: |
          ./dotfiles uninstall
          ! find "$HOME" -type l -lname "$PWD/*" | grep -q .
          [ -f "$HOME/.claude/settings.json" ]

  e2e-mechanism:
    name: dotfiles E2E (mechanisms, synthetic fixture)
    # Runs dotfiles against a throwaway source tree with fixture-owned names,
    # so every mechanism assertion is independent of the shipped common/ payload
    # (which changes often). dotfiles resolves its source from its own dir, so
    # copying it next to a synthetic common/ + users/ + mirror.conf is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build a throwaway source tree (real dotfiles + lib, synthetic payload)
        run: |
          FX=$(mktemp -d); echo "FX=$FX" >> "$GITHUB_ENV"
          cp dotfiles "$FX/"; cp -r lib "$FX/"
          mkdir -p "$FX/common/.agents/skills/demoskill" "$FX/common/.claude"
          printf 'CANONICAL (common)\n'              >"$FX/common/.agents/AGENTS.md"
          printf 'demo skill\n'                      >"$FX/common/.agents/skills/demoskill/SKILL.md"
          printf '#!/usr/bin/env bash\necho common\n' >"$FX/common/.claude/demo.sh"
          printf '{ "statusLine": { "x": "common" }, "commonOnly": 1 }\n' \
            >"$FX/common/.claude/settings.fragment.json"
          mkdir -p "$FX/users/fx/.agents" "$FX/users/fx/.claude" "$FX/users/fx/.fxtop"
          printf 'CANONICAL (user fx)\n'             >"$FX/users/fx/.agents/AGENTS.md"
          printf '#!/usr/bin/env bash\necho user\n'  >"$FX/users/fx/.claude/demo.sh"
          printf '{ "statusLine": { "x": "user" }, "userKey": true }\n' \
            >"$FX/users/fx/.claude/settings.fragment.json"
          printf 'fx marker\n'                       >"$FX/users/fx/.fxtop/marker"
          mkdir -p "$FX/profiles/bd/.agents" "$FX/profiles/bd/.claude" "$FX/profiles/bd/.bdtop" "$FX/profiles/bd2/.claude"
          printf 'CANONICAL (profile bd)\n'          >"$FX/profiles/bd/.agents/AGENTS.md"
          printf '#!/usr/bin/env bash\necho bd\n'    >"$FX/profiles/bd/.claude/demo.sh"
          printf '{ "statusLine": { "x": "profile" }, "profileKey": true }\n' \
            >"$FX/profiles/bd/.claude/settings.fragment.json"
          printf 'bd marker\n'                       >"$FX/profiles/bd/.bdtop/marker"
          printf '#!/usr/bin/env bash\necho bd2\n'   >"$FX/profiles/bd2/.claude/demo.sh"
          printf '%s\n' '.codex/AGENTS.md        .agents/AGENTS.md' \
                        '.demo/INSTRUCTIONS.md   .agents/AGENTS.md' \
                        '.demo/skills            .agents/skills'    >"$FX/mirror.conf"
          # dotfiles remembers a --profile selection in the tree's git config,
          # so the fixture has to be a checkout for that path to be exercised
          git init -q "$FX"
          git -C "$FX" config user.email ci@example.com
          git -C "$FX" config user.name ci

      - name: Setup isolated HOME
        run: echo "HOME=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Common-only — layout, mirror, fragment, status, idempotency
        run: |
          cd "$FX"
          ./dotfiles install >/dev/null
          # dot-directories are real dirs; only leaves are symlinked
          [ -d "$HOME/.agents" ]
          [ ! -L "$HOME/.agents" ]
          [ -d "$HOME/.demo" ]
          [ ! -L "$HOME/.demo" ]
          [ -L "$HOME/.agents/AGENTS.md" ]
          [ -d "$HOME/.agents/skills" ]
          [ ! -L "$HOME/.agents/skills" ]
          [ -L "$HOME/.agents/skills/demoskill/SKILL.md" ]
          # file mirrors resolve to the single canonical source
          [ -L "$HOME/.codex/AGENTS.md" ]
          cmp -s "$HOME/.codex/AGENTS.md" "$HOME/.agents/AGENTS.md"
          [ -L "$HOME/.demo/INSTRUCTIONS.md" ]
          cmp -s "$HOME/.demo/INSTRUCTIONS.md" "$HOME/.agents/AGENTS.md"
          # the directory mirror is a single dir symlink
          [ -L "$HOME/.demo/skills" ]
          [ -d "$HOME/.demo/skills" ]
          [ -e "$HOME/.demo/skills/demoskill/SKILL.md" ]
          # a fragment is merged into a real settings.json
          [ -f "$HOME/.claude/settings.json" ]
          [ ! -L "$HOME/.claude/settings.json" ]
          jq -e '.commonOnly == 1' "$HOME/.claude/settings.json" >/dev/null
          ./dotfiles status | tee status.out
          ! grep -E '^[[:space:]]*(drift|missing|orphan)[[:space:]]*:' status.out
          ./dotfiles install | tee install2.out
          ! grep -E '^[[:space:]]*(linked|merged)[[:space:]]*:' install2.out

      - name: Common-only — force re-merge and 3-way delete
        run: |
          cd "$FX"
          # the fragment value wins over an edited target (fixture's own key)
          tmp=$(mktemp); jq '.commonOnly = 999' "$HOME/.claude/settings.json" >"$tmp"; mv "$tmp" "$HOME/.claude/settings.json"
          ./dotfiles install --force | tee force.out
          grep -qE '^[[:space:]]*merged[[:space:]]*:.*/\.claude/settings\.json$' force.out
          jq -e '.commonOnly == 1' "$HOME/.claude/settings.json" >/dev/null
          # a manually-added key survives --force; a second force is a no-op
          tmp=$(mktemp); jq '.myManualKey = true' "$HOME/.claude/settings.json" >"$tmp"; mv "$tmp" "$HOME/.claude/settings.json"
          ./dotfiles install --force >/dev/null
          jq -e '.myManualKey == true' "$HOME/.claude/settings.json" >/dev/null
          ./dotfiles install --force | tee force2.out
          ! grep -qE '^[[:space:]]*merged[[:space:]]*:' force2.out
          rm -f "$HOME/.claude/settings.json"; ./dotfiles install >/dev/null
          # 3-way: a key in the base, gone from the fragment, is deleted; a
          # user-only key (never in the base) and a protected key are preserved
          ./dotfiles install --force >/dev/null
          [ -f "$HOME/.claude/settings.fragment.base.json" ]
          tmp=$(mktemp); jq '.userOnly = 1 | .willBeRemoved = {"a":1}' "$HOME/.claude/settings.json" >"$tmp"; mv "$tmp" "$HOME/.claude/settings.json"
          tmp=$(mktemp); jq '.willBeRemoved = {"a":1}' "$HOME/.claude/settings.fragment.base.json" >"$tmp"; mv "$tmp" "$HOME/.claude/settings.fragment.base.json"
          ./dotfiles install --force >/dev/null
          jq -e 'has("willBeRemoved") | not' "$HOME/.claude/settings.json" >/dev/null
          jq -e '.userOnly == 1' "$HOME/.claude/settings.json" >/dev/null
          tmp=$(mktemp); jq '.token = "SECRET"' "$HOME/.claude/settings.json" >"$tmp"; mv "$tmp" "$HOME/.claude/settings.json"
          ./dotfiles install --force >/dev/null
          jq -e '.token == "SECRET"' "$HOME/.claude/settings.json" >/dev/null
          rm -f "$HOME/.claude/settings.json" "$HOME/.claude/settings.json.dotfiles-bak."*; ./dotfiles install >/dev/null

      - name: Common-only — prune, clean-backups, doctor, missing mirror source
        run: |
          cd "$FX"
          # prune never removes a tool's own state under a managed dir
          mkdir -p "$HOME/.claude/session-env/s1"; : >"$HOME/.claude/session-env/s1/state"; : >"$HOME/.claude/own.txt"
          ./dotfiles install
          [ -f "$HOME/.claude/session-env/s1/state" ]
          [ -f "$HOME/.claude/own.txt" ]
          rm -rf "$HOME/.claude/session-env" "$HOME/.claude/own.txt"; ./dotfiles install
          # a subtree that vanished from the layer still gets its orphans pruned,
          # at any depth, and the emptied directories go with them
          mkdir -p common/.claude/fxgone/deep; : >common/.claude/fxgone/deep/leaf
          ./dotfiles install >/dev/null
          [ -L "$HOME/.claude/fxgone/deep/leaf" ]
          rm -r common/.claude/fxgone
          ./dotfiles status | tee vanish.out
          grep -qE '^[[:space:]]*orphan[[:space:]]*:.*/\.claude/fxgone/deep/leaf$' vanish.out
          ./dotfiles install | tee vanish2.out
          grep -qE '^[[:space:]]*pruned[[:space:]]*:.*/\.claude/fxgone/deep/leaf$' vanish2.out
          [ ! -e "$HOME/.claude/fxgone" ]
          # clean-backups: report-only lists; --keep 1 keeps the newest per original
          for ts in 20230101T000000Z 20250101T000000Z; do : >"$HOME/.claude/foo.dotfiles-bak.$ts"; done
          ./dotfiles clean-backups | tee cb.out
          grep -q '2 backup(s) found' cb.out
          ./dotfiles clean-backups --keep 1
          [ ! -e "$HOME/.claude/foo.dotfiles-bak.20230101T000000Z" ]
          [ -e "$HOME/.claude/foo.dotfiles-bak.20250101T000000Z" ]
          [ -L "$HOME/.claude/demo.sh" ] # managed symlinks are untouched
          rm -f "$HOME/.claude/foo.dotfiles-bak."*
          # doctor: clean bill, then a moved-repo stale link flagged with nonzero exit
          ./dotfiles doctor >doc.out 2>&1; grep -q 'no broken or stale' doc.out
          ln -s "/old/checkout/azarashi/common/.agents/AGENTS.md" "$HOME/.claude/stale"
          if ./dotfiles doctor >doc.out 2>&1; then echo "doctor should be nonzero"; cat doc.out; exit 1; fi
          grep -qE '^stale   : .*/\.claude/stale' doc.out
          # doctor --fix repairs what it finds: the dead stale link is dropped
          ./dotfiles doctor --fix | tee fix.out
          grep -q 'repaired 1 issue' fix.out
          [ ! -L "$HOME/.claude/stale" ]
          ./dotfiles doctor >/dev/null
          # a missing mirror source warns and is skipped, never fatal
          printf '%s\n' '.nope/MISSING.md   .agents/does-not-exist.md' >>mirror.conf
          ./dotfiles install 2>err.out
          grep -q 'mirror source not found, skipping' err.out
          [ ! -e "$HOME/.nope/MISSING.md" ]
          [ -L "$HOME/.codex/AGENTS.md" ]
          grep -v '.nope/MISSING.md' mirror.conf >mirror.conf.tmp && mv mirror.conf.tmp mirror.conf

      - name: Common-only — mirror.conf rejects unsafe and malformed rules
        run: |
          cd "$FX"
          # snapshot so the bad rules below don't leak into later steps
          cp mirror.conf mirror.conf.orig
          printf '%s\n' \
            '../escape   .agents/AGENTS.md' \
            '.bad/abs    /etc/passwd' \
            '.bad/dots   ../../.agents/AGENTS.md' \
            '.bad/extra  .agents/AGENTS.md  third' >>mirror.conf
          ./dotfiles install 2>warn.out
          grep -qF "unsafe target (absolute or '..'): ../escape" warn.out
          grep -qF "unsafe source (absolute or '..'): /etc/passwd" warn.out
          grep -qF "unsafe source (absolute or '..'): ../../.agents/AGENTS.md" warn.out
          grep -qF "malformed rule" warn.out
          # no unsafe/malformed rule is ever applied
          [ ! -e "$HOME/.bad/abs" ]
          [ ! -e "$HOME/.bad/dots" ]
          [ ! -e "$HOME/.bad/extra" ]
          # a valid rule alongside them still deploys
          [ -L "$HOME/.codex/AGENTS.md" ]
          mv mirror.conf.orig mirror.conf
          ./dotfiles install >/dev/null

      - name: Common-only — uninstall
        run: |
          cd "$FX"
          # a subtree that vanished from the layer is still cleaned up on uninstall
          mkdir -p common/.claude/fxgone/deep; : >common/.claude/fxgone/deep/leaf
          ./dotfiles install >/dev/null
          rm -r common/.claude/fxgone
          ./dotfiles uninstall
          [ ! -e "$HOME/.claude/fxgone" ]
          [ ! -e "$HOME/.agents" ]
          [ ! -e "$HOME/.codex/AGENTS.md" ]
          [ ! -e "$HOME/.demo/INSTRUCTIONS.md" ]
          [ ! -e "$HOME/.demo/skills" ]
          ! find "$HOME" -type l -lname "$PWD/*" | grep -q .
          [ -f "$HOME/.claude/settings.json" ]

      - name: Reset isolated HOME for the per-user pass
        run: echo "HOME=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Per-user — override, mirror-follows-override, fallback, layering, user-only
        run: |
          cd "$FX"
          ./dotfiles install --user fx >/dev/null
          # a user file wins over common (plain leaf and the mirror's canonical source)
          case "$(readlink "$HOME/.claude/demo.sh")" in */users/fx/.claude/demo.sh) ;; *) echo "demo.sh override FAIL"; exit 1 ;; esac
          case "$(readlink "$HOME/.agents/AGENTS.md")" in */users/fx/.agents/AGENTS.md) ;; *) echo "AGENTS override FAIL"; exit 1 ;; esac
          # the file mirror follows the per-user override of its source
          case "$(readlink "$HOME/.codex/AGENTS.md")" in */users/fx/.agents/AGENTS.md) ;; *) echo "mirror-follows-override FAIL"; exit 1 ;; esac
          # a source with no user override falls back to common
          case "$(readlink "$HOME/.demo/skills")" in */common/.agents/skills) ;; *) echo "common fallback FAIL"; exit 1 ;; esac
          # a user-only top-level entry is a real dir whose leaves link into the user layer
          [ -d "$HOME/.fxtop" ]
          [ ! -L "$HOME/.fxtop" ]
          [ -L "$HOME/.fxtop/marker" ]
          # fragment layering: user value wins, both layers' keys are present
          jq -e '.statusLine.x == "user" and .userKey == true and .commonOnly == 1' "$HOME/.claude/settings.json" >/dev/null

      - name: Per-user — force re-merge and 3-way delete (fixture userKey)
        run: |
          cd "$FX"
          # the user fragment value wins over an edited target
          tmp=$(mktemp); jq '.userKey = "edited"' "$HOME/.claude/settings.json" >"$tmp"; mv "$tmp" "$HOME/.claude/settings.json"
          ./dotfiles install --user fx --force | tee force.out
          grep -qE '^[[:space:]]*merged[[:space:]]*:.*/\.claude/settings\.json$' force.out
          jq -e '.userKey == true' "$HOME/.claude/settings.json" >/dev/null
          # snapshot a base, then drop userKey from the user fragment: 3-way deletes it
          ./dotfiles install --user fx --force >/dev/null
          [ -f "$HOME/.claude/settings.fragment.base.json" ]
          printf '{ "statusLine": { "x": "user" } }\n' >users/fx/.claude/settings.fragment.json
          ./dotfiles install --user fx --force >/dev/null
          jq -e 'has("userKey") | not' "$HOME/.claude/settings.json" >/dev/null
          jq -e '.statusLine.x == "user"' "$HOME/.claude/settings.json" >/dev/null

      - name: Per-user — switch-off prune, invalid user, uninstall
        run: |
          cd "$FX"
          # switching to a user without that overlay dir prunes the overlay-only dir
          [ -d "$HOME/.fxtop" ]
          [ ! -L "$HOME/.fxtop" ]
          ./dotfiles install --user nobody-no-dir | tee switch.out
          [ ! -e "$HOME/.fxtop" ]
          grep -qE '^[[:space:]]*pruned[[:space:]]*:.*\.fxtop$' switch.out
          # an invalid --user is rejected
          ! ./dotfiles install --user '../evil'
          # uninstall removes managed symlinks; the merged settings.json stays
          ./dotfiles install --user fx >/dev/null
          ./dotfiles uninstall --user fx >/dev/null
          [ ! -e "$HOME/.agents" ]
          [ ! -e "$HOME/.codex/AGENTS.md" ]
          [ ! -e "$HOME/.demo/skills" ]
          ! find "$HOME" -type l -lname "$PWD/*" | grep -q .
          [ -f "$HOME/.claude/settings.json" ]

      - name: Reset isolated HOME for the per-profile pass
        run: echo "HOME=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Per-profile — override, mirror-follows-override, profile-only entry, persistence
        run: |
          cd "$FX"
          ./dotfiles install --profile bd >/dev/null
          # a profile file wins over common (plain leaf and the mirror's canonical source)
          case "$(readlink "$HOME/.claude/demo.sh")" in */profiles/bd/.claude/demo.sh) ;; *) echo "profile override FAIL"; exit 1 ;; esac
          case "$(readlink "$HOME/.codex/AGENTS.md")" in */profiles/bd/.agents/AGENTS.md) ;; *) echo "mirror-follows-profile FAIL"; exit 1 ;; esac
          # a source with no profile override falls back to common
          case "$(readlink "$HOME/.demo/skills")" in */common/.agents/skills) ;; *) echo "common fallback FAIL"; exit 1 ;; esac
          # a profile-only top-level entry is a real dir whose leaves link into the profile layer
          [ -d "$HOME/.bdtop" ]
          [ ! -L "$HOME/.bdtop" ]
          [ -L "$HOME/.bdtop/marker" ]
          # fragment layering: the profile value wins over common, both layers' keys are present
          jq -e '.statusLine.x == "profile" and .profileKey == true and .commonOnly == 1' "$HOME/.claude/settings.json" >/dev/null
          # the selection is remembered, so a later run needs no flag
          [ "$(git config --get-all dotfiles.profile)" = "bd" ]
          ./dotfiles install >/dev/null
          case "$(readlink "$HOME/.claude/demo.sh")" in */profiles/bd/.claude/demo.sh) ;; *) echo "persistence FAIL"; exit 1 ;; esac

      - name: Per-profile — DOTFILES_PROFILE overrides the stored selection without remembering
        run: |
          cd "$FX"
          DOTFILES_PROFILE=bd2 ./dotfiles install >/dev/null
          case "$(readlink "$HOME/.claude/demo.sh")" in */profiles/bd2/.claude/demo.sh) ;; *) echo "env profile FAIL"; exit 1 ;; esac
          [ "$(git config --get-all dotfiles.profile)" = "bd" ]
          DOTFILES_PROFILE=bd2 ./dotfiles config | grep -qE '^[[:space:]]*profiles[[:space:]]*:[[:space:]]*bd2[[:space:]]+\(DOTFILES_PROFILE\)$'
          # --profile still beats the env var
          DOTFILES_PROFILE=bd2 ./dotfiles config --profile bd | grep -qE '^[[:space:]]*profiles[[:space:]]*:[[:space:]]*bd[[:space:]]+\(--profile\)$'
          # an invalid env value is fatal, like an invalid --profile
          ! DOTFILES_PROFILE='../bd' ./dotfiles config >/dev/null 2>&1
          # glob metacharacters are rejected as names, and never expanded against the cwd
          # first — '[l]ib' would otherwise match the fixture's lib/ (fatal, like --profile)
          ! DOTFILES_PROFILE='[l]ib' ./dotfiles config >/dev/null 2>&1
          ! ./dotfiles config --profile '[l]ib' >/dev/null 2>&1
          # a stored '[l]ib' is reported by its literal name, not silently expanded to lib
          git config --add dotfiles.profile '[l]ib'
          ./dotfiles config 2>&1 | grep -qF "unusable stored profile name: [l]ib"
          git config --unset dotfiles.profile '\[l\]ib'
          [ "$(git config --get-all dotfiles.profile)" = "bd" ]
          # a blank env value counts as unset and falls back to the stored selection
          DOTFILES_PROFILE='  ' ./dotfiles config | grep -qE '^[[:space:]]*profiles[[:space:]]*:[[:space:]]*bd[[:space:]]+\(git config dotfiles.profile\)$'
          # the stored selection is back in effect once the env var is gone
          ./dotfiles install >/dev/null
          case "$(readlink "$HOME/.claude/demo.sh")" in */profiles/bd/.claude/demo.sh) ;; *) echo "stored after env FAIL"; exit 1 ;; esac

      - name: Reset isolated HOME for the three-layer pass
        run: echo "HOME=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Three layers — user beats profile beats common, config report
        run: |
          cd "$FX"
          ./dotfiles install --user fx --profile bd >/dev/null
          case "$(readlink "$HOME/.claude/demo.sh")" in */users/fx/.claude/demo.sh) ;; *) echo "user-over-profile FAIL"; exit 1 ;; esac
          # every layer contributes; the highest one wins the shared key
          jq -e '.statusLine.x == "user" and .profileKey == true and .commonOnly == 1' "$HOME/.claude/settings.json" >/dev/null
          ./dotfiles config --user fx | tee config.out
          grep -qE '^[[:space:]]*profiles[[:space:]]*:[[:space:]]*bd([[:space:]]|$)' config.out
          grep -qE '^[[:space:]]*layers[[:space:]]*:[[:space:]]*common < profiles/bd < users/fx$' config.out

      - name: Per-profile — multiple profiles, read-only runs, unset-profile prune, invalid
        run: |
          cd "$FX"
          # a later --profile wins over an earlier one, and both are remembered
          ./dotfiles install --user fx --profile bd --profile bd2 >/dev/null
          case "$(readlink "$HOME/.claude/demo.sh")" in */users/fx/.claude/demo.sh) ;; *) echo "user still wins FAIL"; exit 1 ;; esac
          [ "$(git config --get-all dotfiles.profile | tr '\n' ' ')" = "bd bd2 " ]
          # re-specifying replaces the stored set instead of appending to it
          ./dotfiles install --user fx --profile bd >/dev/null
          [ "$(git config --get-all dotfiles.profile)" = "bd" ]
          # a dry-run or read-only command never rewrites the stored selection
          ./dotfiles install --user fx --profile bd2 --dry-run >/dev/null
          ./dotfiles status --user fx --profile bd2 >/dev/null
          [ "$(git config --get-all dotfiles.profile)" = "bd" ]
          # unset-profile forgets it; the next install prunes the profile-only entry
          [ -d "$HOME/.bdtop" ]
          [ ! -L "$HOME/.bdtop" ]
          ./dotfiles config --unset-profile
          [ -z "$(git config --get-all dotfiles.profile || true)" ]
          ./dotfiles install --user fx | tee unset.out
          [ ! -e "$HOME/.bdtop" ]
          grep -qE '^[[:space:]]*pruned[[:space:]]*:.*\.bdtop$' unset.out
          # ...and the shared leaf falls back to the user layer
          case "$(readlink "$HOME/.claude/demo.sh")" in */users/fx/.claude/demo.sh) ;; *) echo "post-unset fallback FAIL"; exit 1 ;; esac
          # an invalid --profile is rejected
          ! ./dotfiles install --profile '../evil'
          # uninstall removes profile-sourced links too
          ./dotfiles install --user fx --profile bd >/dev/null
          ./dotfiles uninstall >/dev/null
          ! find "$HOME" -type l -lname "$PWD/*" | grep -q .
          [ -f "$HOME/.claude/settings.json" ]

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
