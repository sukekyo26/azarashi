name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    name: shellcheck + shfmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1

      # Install the latest upstream shellcheck (same source as the devcontainer)
      # so CI and local devcontainer share the same lint behavior. The ubuntu
      # runner's preinstalled shellcheck lags upstream and emits findings that
      # newer releases have already retracted.
      - name: Install latest shellcheck
        run: |
          set -euo pipefail
          sudo rm -f /usr/local/bin/shellcheck /usr/bin/shellcheck
          version=$(curl -fsSLI --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 --retry-all-errors \
            -o /dev/null -w '%{url_effective}' https://github.com/koalaman/shellcheck/releases/latest |
            sed 's|.*/tag/v||')
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 --retry-all-errors \
            "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 "shellcheck-v${version}/shellcheck"
          sudo chmod +x /usr/local/bin/shellcheck
          shellcheck --version

      - run: just check

  e2e:
    name: install.sh E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup isolated HOME
        run: |
          dir=$(mktemp -d)
          echo "HOME=$dir" >> "$GITHUB_ENV"

      - name: Dry-run on clean state — must not mutate HOME
        run: |
          ./install.sh diff
          [ ! -e "$HOME/.claude" ]
          [ ! -e "$HOME/.agents" ]
          [ ! -e "$HOME/.copilot" ]

      - name: First install
        run: ./install.sh install

      - name: status — assert all in-sync (no drift/missing/orphan)
        run: |
          ./install.sh status | tee status.out
          ! grep -E '^[[:space:]]*(drift|missing|orphan)[[:space:]]*:' status.out

      - name: Layout sanity check
        run: |
          # dot-directories are always real directories (never symlinked)
          [ -d "$HOME/.agents" ] && [ ! -L "$HOME/.agents" ]
          [ -d "$HOME/.claude" ] && [ ! -L "$HOME/.claude" ]
          [ -d "$HOME/.copilot" ] && [ ! -L "$HOME/.copilot" ]
          # canonical .agents: AGENTS.md is a leaf symlink, skills is materialized
          [ -L "$HOME/.agents/AGENTS.md" ]
          [ -d "$HOME/.agents/skills" ] && [ ! -L "$HOME/.agents/skills" ]
          [ -L "$HOME/.agents/skills/changelog/SKILL.md" ]
          # file mirrors resolve to the single canonical AGENTS.md
          [ -L "$HOME/.claude/CLAUDE.md" ] && cmp -s "$HOME/.claude/CLAUDE.md" "$HOME/.agents/AGENTS.md"
          [ -L "$HOME/.copilot/copilot-instructions.md" ] && cmp -s "$HOME/.copilot/copilot-instructions.md" "$HOME/.agents/AGENTS.md"
          # the skills mirror is a single directory symlink (no folder materialized)
          [ -L "$HOME/.claude/skills" ] && [ -d "$HOME/.claude/skills" ]
          [ -e "$HOME/.claude/skills/changelog/SKILL.md" ]
          # a fragment is merged into a real settings.json (not a symlink)
          [ -f "$HOME/.claude/settings.json" ] && [ ! -L "$HOME/.claude/settings.json" ]
          [ -f "$HOME/.copilot/settings.json" ] && [ ! -L "$HOME/.copilot/settings.json" ]

      - name: Idempotency — second install must not relink or remerge
        run: |
          ./install.sh install | tee install2.out
          ! grep -E '^[[:space:]]*(linked|merged)[[:space:]]*:' install2.out

      - name: Prune must never touch a tool's own state under a managed dir
        run: |
          # directories no layer defines (here: a tool's runtime state) must be
          # left alone by prune, including empty ones
          mkdir -p "$HOME/.claude/session-env/sess1" "$HOME/.claude/empty-tool-dir"
          : >"$HOME/.claude/session-env/sess1/state"
          : >"$HOME/.claude/own-file.txt"
          ./install.sh install
          [ -f "$HOME/.claude/session-env/sess1/state" ]
          [ -d "$HOME/.claude/empty-tool-dir" ]
          [ -f "$HOME/.claude/own-file.txt" ]
          # the same must hold for uninstall
          ./install.sh uninstall
          [ -f "$HOME/.claude/session-env/sess1/state" ]
          [ -d "$HOME/.claude/empty-tool-dir" ]
          [ -f "$HOME/.claude/own-file.txt" ]
          # restore a clean install for the steps below
          rm -rf "$HOME/.claude/session-env" "$HOME/.claude/empty-tool-dir" "$HOME/.claude/own-file.txt"
          ./install.sh install

      - name: Uninstall removes symlinks (merged JSON intentionally remains)
        run: |
          ./install.sh uninstall
          [ ! -e "$HOME/.agents" ]
          [ ! -e "$HOME/.claude/CLAUDE.md" ]
          [ ! -e "$HOME/.claude/skills" ]
          [ ! -e "$HOME/.copilot/copilot-instructions.md" ]
          ! find "$HOME" -type l -lname "$PWD/*" | grep -q .
          [ -f "$HOME/.claude/settings.json" ]

  e2e-user:
    name: install.sh E2E (per-user overlay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The overlay fixture is created on the runner only — never committed.
      - name: Create a runtime per-user overlay fixture
        run: |
          mkdir -p users/citest/.claude users/citest/.agents users/citest/.citest-top
          printf 'citest AGENTS\n' >users/citest/.agents/AGENTS.md
          printf '#!/usr/bin/env bash\necho citest\n' >users/citest/.claude/statusline.sh
          printf 'citest\n' >users/citest/.claude/citest-marker
          printf '{ "statusLine": { "padding": 5 }, "citestUserKey": true }\n' \
            >users/citest/.claude/settings.fragment.json
          printf 'citest\n' >users/citest/.citest-top/marker

      - name: Setup isolated HOME
        run: |
          dir=$(mktemp -d)
          echo "HOME=$dir" >> "$GITHUB_ENV"

      - name: Install with --user citest
        run: ./install.sh install --user citest

      - name: Override wins; non-overridden falls back to common
        run: |
          o=$(readlink "$HOME/.claude/statusline.sh")
          case "$o" in */users/citest/.claude/statusline.sh) ;; *) echo "statusline.sh -> $o"; exit 1 ;; esac
          m=$(readlink "$HOME/.claude/citest-marker")
          case "$m" in */users/citest/.claude/citest-marker) ;; *) echo "citest-marker -> $m"; exit 1 ;; esac
          # the AGENTS.md file mirror follows the per-user override (CLAUDE.md and
          # copilot-instructions.md both mirror users/citest/.agents/AGENTS.md)
          c=$(readlink "$HOME/.claude/CLAUDE.md")
          case "$c" in */users/citest/.agents/AGENTS.md) ;; *) echo "CLAUDE.md -> $c"; exit 1 ;; esac
          ci=$(readlink "$HOME/.copilot/copilot-instructions.md")
          case "$ci" in */users/citest/.agents/AGENTS.md) ;; *) echo "copilot-instructions -> $ci"; exit 1 ;; esac
          aa=$(readlink "$HOME/.agents/AGENTS.md")
          case "$aa" in */users/citest/.agents/AGENTS.md) ;; *) echo ".agents/AGENTS.md -> $aa"; exit 1 ;; esac
          # the skills mirror is a single dir symlink; with no user override it falls back to common
          [ -L "$HOME/.claude/skills" ]
          s=$(readlink "$HOME/.claude/skills")
          case "$s" in */common/.agents/skills) ;; *) echo ".claude/skills -> $s"; exit 1 ;; esac
          # .agents (no skills override) is a real dir whose skills leaves link into common
          [ -d "$HOME/.agents" ] && [ ! -L "$HOME/.agents" ]
          a=$(readlink "$HOME/.agents/skills/changelog/SKILL.md")
          case "$a" in */common/.agents/skills/changelog/SKILL.md) ;; *) echo ".agents leaf -> $a"; exit 1 ;; esac
          # a user-only top-level entry is a real dir whose leaves link into users/citest
          [ -d "$HOME/.citest-top" ] && [ ! -L "$HOME/.citest-top" ]
          t=$(readlink "$HOME/.citest-top/marker")
          case "$t" in */users/citest/.citest-top/marker) ;; *) echo ".citest-top/marker -> $t"; exit 1 ;; esac

      - name: Fragment merge layering (target > user > common)
        run: |
          jq -e '.statusLine.command == "bash ~/.claude/statusline.sh"' "$HOME/.claude/settings.json"
          jq -e '.statusLine.padding == 5' "$HOME/.claude/settings.json"
          jq -e '.citestUserKey == true' "$HOME/.claude/settings.json"

      - name: status — assert all in-sync (no drift/missing/orphan)
        run: |
          ./install.sh status --user citest | tee status.out
          ! grep -E '^[[:space:]]*(drift|missing|orphan)[[:space:]]*:' status.out

      - name: Idempotency — second install must not relink or remerge
        run: |
          ./install.sh install --user citest | tee install2.out
          ! grep -E '^[[:space:]]*(linked|merged)[[:space:]]*:' install2.out

      - name: Switching off the user prunes its top-level overlay dir
        run: |
          [ -d "$HOME/.citest-top" ] && [ ! -L "$HOME/.citest-top" ]
          ./install.sh install --user nobody-no-dir | tee switch.out
          [ ! -e "$HOME/.citest-top" ]
          grep -qE '^[[:space:]]*pruned[[:space:]]*:.*\.citest-top$' switch.out

      - name: Invalid --user must fail
        run: |
          ! ./install.sh install --user '../evil'

      - name: Uninstall removes managed symlinks (merged JSON intentionally remains)
        run: |
          ./install.sh uninstall --user citest
          [ ! -e "$HOME/.claude/CLAUDE.md" ]
          [ ! -e "$HOME/.claude/skills" ]
          [ ! -e "$HOME/.copilot/copilot-instructions.md" ]
          # .agents had only symlinked leaves -> emptied and removed entirely
          [ ! -e "$HOME/.agents" ]
          # .copilot keeps its merged settings.json, so the real dir remains
          [ ! -L "$HOME/.copilot" ]
          ! find "$HOME" -type l -lname "$PWD/*" | grep -q .
          [ -f "$HOME/.claude/settings.json" ]

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
