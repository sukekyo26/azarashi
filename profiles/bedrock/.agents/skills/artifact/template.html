<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="local-artifacts template">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Murecho:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* artifacts.mjs publish が本文だけの HTML を包む雛形。クラスの使い方は SKILL.md を参照 */
  :root {
    --bg: #f3f5f4; --surface: #fff; --fg: #18201e; --muted: #57635f; --line: #d4dbd8;
    --accent: #1d6670; --accent-soft: #dcebec;
    --good: #1f7a45; --good-soft: #dcefe3; --warn: #8a5a10; --warn-soft: #f6e8d2; --bad: #b3261e; --bad-soft: #fbe5e2;
    --display: "Murecho", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    /* 本文全体の幅と、読みやすさのために短く保つ文章の幅 */
    --page-width: 96rem; --text-width: 56rem;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111716; --surface: #182120; --fg: #e2e9e7; --muted: #97a5a2; --line: #2b3634;
      --accent: #63b5be; --accent-soft: #1b3336;
      --good: #6fcf97; --good-soft: #173126; --warn: #e2a85e; --warn-soft: #392b18; --bad: #f2b8b5; --bad-soft: #3b1f1d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
    font-size: 16px; line-height: 1.85; padding-inline: 16px; padding-block: 2.5rem 4rem;
  }
  main { max-width: var(--page-width); margin-inline: auto; display: grid; gap: 2.5rem; }
  main > *, section > * { min-width: 0; }
  h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 700; line-height: 1.35; text-wrap: balance; }
  h1 { font-size: clamp(1.8rem, 4.5vw, 2.5rem); font-weight: 800; letter-spacing: 0.01em; }
  h2 { font-size: 1.4rem; }
  h3 { font-size: 1.05rem; }
  p, ul, ol { margin: 0; max-width: var(--text-width); }
  ul, ol { padding-left: 1.3rem; display: grid; gap: 0.3rem; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  header { display: grid; gap: 0.7rem; }
  section { display: grid; gap: 1rem; }
  section > h2 { border-top: 1px solid var(--line); padding-top: 1.3rem; }
  .eyebrow { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .lead { color: var(--muted); font-size: 1.05rem; }
  .muted { color: var(--muted); }
  code { font-family: var(--mono); font-size: 0.86em; background: var(--accent-soft); padding: 0.1em 0.35em; border-radius: 4px; }
  pre {
    margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 0.9rem 1rem; overflow-x: auto; font-family: var(--mono); font-size: 0.84rem; line-height: 1.65;
  }
  pre code { background: none; padding: 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0.75rem; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 0.9rem 1rem; display: grid; gap: 0.35rem; align-content: start; min-width: 0;
  }
  .card p { color: var(--muted); font-size: 0.92rem; }
  .stats { display: flex; flex-wrap: wrap; gap: 0.75rem 2rem; }
  .stat { display: grid; }
  .stat b { font-family: var(--mono); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 0.85rem; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; background: var(--surface); }
  th, td { text-align: left; vertical-align: baseline; padding: 0.6rem 0.85rem; border-bottom: 1px solid var(--line); }
  /* 狭い幅で文字の列を潰さず、.table-wrap の中で横スクロールさせる */
  th:not(.num), td:not(.num) { min-width: 7em; }
  thead th { font-family: var(--display); font-size: 0.88rem; border-bottom: 2px solid var(--fg); }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill {
    display: inline-block; font-family: var(--mono); font-size: 0.74rem; font-weight: 600;
    padding: 0.1em 0.6em; border-radius: 999px; white-space: nowrap; background: var(--accent-soft); color: var(--accent);
  }
  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .note { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 0.75rem 1rem; border-radius: 0 6px 6px 0; max-width: var(--text-width); }
  .note.warn { background: var(--warn-soft); border-color: var(--warn); }
  .note.bad { background: var(--bad-soft); border-color: var(--bad); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
{{content}}
</main>
</body>
</html>
