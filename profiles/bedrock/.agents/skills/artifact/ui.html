<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Artifacts</title>
<style>
  :root {
    --bg: #f4f6f6; --surface: #fff; --fg: #18201f; --muted: #5a6663; --line: #d6dddb;
    --accent: #1d6a73; --danger: #b3261e; --danger-soft: #fbe9e7;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111716; --surface: #182120; --fg: #e2e9e7; --muted: #97a5a2; --line: #2b3634;
      --accent: #63b5be; --danger: #f2b8b5; --danger-soft: #3b1f1d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.7 system-ui, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    padding-inline: 16px; padding-block: 2rem 4rem;
  }
  main { max-width: 52rem; margin-inline: auto; display: grid; gap: 1.5rem; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.5rem 1rem; }
  h1 { margin: 0; font-size: 1.4rem; }
  .count { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  input[type="search"], select {
    padding: 0.55rem 0.75rem; font: inherit; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  }
  input[type="search"] { flex: 1 1 14rem; min-width: 0; }
  select { flex: 0 1 auto; min-width: 0; max-width: 100%; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
  li {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 0.8rem 1rem; display: grid; grid-template-columns: 1fr auto; gap: 0.2rem 1rem; align-items: start;
  }
  li > div { min-width: 0; display: grid; gap: 0.15rem; }
  a.title { color: var(--accent); font-weight: 700; text-decoration: none; overflow-wrap: anywhere; }
  a.title:hover { text-decoration: underline; }
  .desc { color: var(--fg); font-size: 0.92rem; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 0.8rem; font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: 0.85rem; padding: 0.3rem 0.8rem; border-radius: 5px; cursor: pointer;
    color: var(--danger); background: transparent; border: 1px solid var(--line);
  }
  button.armed { background: var(--danger-soft); border-color: var(--danger); font-weight: 700; }
  .actions { display: flex; gap: 0.4rem; }
  a.download {
    font-size: 0.85rem; padding: 0.3rem 0.8rem; border-radius: 5px; text-decoration: none;
    color: var(--accent); border: 1px solid var(--line);
  }
  a.download:hover { border-color: var(--accent); }
  /* 狭い幅ではボタンを下に回し、タイトルの幅を確保する */
  @media (max-width: 30rem) { li { grid-template-columns: 1fr; } .actions { justify-content: flex-end; } }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty, .error { color: var(--muted); padding: 1.5rem 0; }
  .error { color: var(--danger); }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85em; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Local Artifacts</h1>
    <span class="count" id="count"></span>
  </header>
  <div class="filters">
    <input type="search" id="q" placeholder="キーワードで絞り込み" aria-label="絞り込み">
    <select id="project" aria-label="プロジェクト"></select>
  </div>
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>まだページがありません。エージェントに「ページにして」と頼むか、<code>artifacts.mjs publish &lt;file.html&gt;</code> で追加できます。</p>
  <p class="error" id="error" hidden></p>
</main>
<template id="row">
  <li>
    <div>
      <a class="title" target="_blank" rel="noopener"></a>
      <span class="desc"></span>
      <span class="meta"></span>
    </div>
    <div class="actions">
      <a class="download">ダウンロード</a>
      <button type="button">削除</button>
    </div>
  </li>
</template>
<script>
  const $ = (id) => document.getElementById(id);
  let items = [];
  // 選んだプロジェクトは URL に持ち、再読み込みやリンクで同じ絞り込みを開けるようにする
  let project = new URLSearchParams(location.search).get('project') ?? '';
  // 生成元を記録する前のページ。project はディレクトリ名で / を含まないので衝突しない
  const NONE = '/';

  const fmt = (iso) => new Date(iso).toLocaleString('ja-JP', { dateStyle: 'medium', timeStyle: 'short' });

  function renderProjects() {
    const counts = new Map();
    for (const a of items) counts.set(a.project ?? NONE, (counts.get(a.project ?? NONE) ?? 0) + 1);
    // 最後の 1 件を消しても選択が勝手に「すべて」へ戻らないよう、0 件でも選択肢に残す
    if (project && !counts.has(project)) counts.set(project, 0);
    const names = [...counts.keys()].filter((k) => k !== NONE).sort((x, y) => x.localeCompare(y));
    const options = [new Option(`すべて (${items.length})`, '')];
    for (const name of names) options.push(new Option(`${name} (${counts.get(name)})`, name));
    if (counts.has(NONE)) options.push(new Option(`記録なし (${counts.get(NONE)})`, NONE));
    $('project').replaceChildren(...options);
    $('project').value = project;
  }

  function showError(msg) {
    $('error').textContent = msg;
    $('error').hidden = !msg;
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    renderProjects();
    const shown = items.filter((a) => (!project || (a.project ?? NONE) === project)
      && (!q || [a.title, a.description, a.slug, a.project].join(' ').toLowerCase().includes(q)));
    $('count').textContent = shown.length === items.length ? `${items.length} 件` : `${shown.length} / ${items.length} 件`;
    $('empty').hidden = items.length > 0;
    $('list').replaceChildren(...shown.map((a) => {
      const li = $('row').content.firstElementChild.cloneNode(true);
      const link = li.querySelector('.title');
      link.href = `/a/${a.slug}/`;
      link.textContent = a.title;
      li.querySelector('.desc').textContent = a.description;
      li.querySelector('.desc').hidden = !a.description;
      li.querySelector('.meta').textContent = `${a.project ? `${a.project} · ` : ''}${a.slug} · 更新 ${fmt(a.updatedAt)}`;
      const dl = li.querySelector('.download');
      dl.href = `/api/artifacts/${a.slug}/download`;
      dl.download = `${a.slug}.html`;
      dl.setAttribute('aria-label', `${a.title} をダウンロード`);
      const btn = li.querySelector('button');
      btn.setAttribute('aria-label', `${a.title} を削除`);
      btn.addEventListener('click', () => remove(a, btn));
      btn.addEventListener('blur', () => { btn.classList.remove('armed'); btn.textContent = '削除'; });
      return li;
    }));
  }

  // 1 回目のクリックで確認状態にし、2 回目で削除する
  async function remove(a, btn) {
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed');
      btn.textContent = '本当に削除';
      return;
    }
    let res;
    try {
      res = await fetch(`/api/artifacts/${a.slug}`, { method: 'DELETE' });
    } catch (e) {
      showError(`「${a.title}」を削除できませんでした（${e.message}）。サーバーが止まっていれば artifacts.mjs serve で起動してください。`);
      return;
    }
    if (!res.ok && res.status !== 404) {
      showError(`「${a.title}」を削除できませんでした（HTTP ${res.status}）。`);
      return;
    }
    showError('');
    items = items.filter((x) => x.slug !== a.slug);
    render();
  }

  async function load() {
    try {
      const res = await fetch('/api/artifacts');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      items = await res.json();
      showError('');
      render();
    } catch (e) {
      showError(`一覧を読み込めませんでした（${e.message}）。サーバーが止まっていれば artifacts.mjs serve で起動してください。`);
    }
  }

  $('q').addEventListener('input', render);
  $('project').addEventListener('change', () => {
    project = $('project').value;
    const url = new URL(location.href);
    if (project) url.searchParams.set('project', project);
    else url.searchParams.delete('project');
    history.replaceState(null, '', url);
    render();
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  load();
</script>
</body>
</html>
